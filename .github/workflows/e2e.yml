# Phase 1 Plan 01-10 (GATE-02): hermetic E2E smoke gate via fixture-replay.
#
# Both jobs set DTC_LLM_MODE=fixture so every LLM call in the tiny-mock
# pipeline resolves against a committed cassette in
# fixtures/tiny-mock/llm-fixtures/. No network, no API keys, zero tokens,
# no fork-vs-same-repo secret asymmetry — this gate runs identically for
# internal PRs, fork PRs, and pushes. Input IR: --design-ir
# fixtures/tiny-mock/design-ir.json (offline spike outcome (b) — see
# fixtures/tiny-mock/README.md). When cassettes drift, re-record them by
# running the pipeline locally with DTC_LLM_MODE=record (future Phase 2
# enhancement) and committing the JSON outputs.
#
# Plan 01-10 fix: macos-14 runners do not ship with xcodegen; install it
# explicitly before invoking the pipeline, which calls xcodegen to emit
# App.xcodeproj from project.yml.
name: E2E
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  e2e-build:
    runs-on: macos-14
    timeout-minutes: 10
    env:
      DTC_LLM_MODE: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install xcodegen
        run: brew install xcodegen
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run tiny fixture pipeline (build-only, IR + cassette replay)
        run: node cli/dist/entry.js run --design-ir fixtures/tiny-mock/design-ir.json --platform swiftui --baas mock --no-upload --skip-simulator --ci --out fixtures/tiny-mock/out
      - name: xcodebuild compile
        run: xcodebuild -project fixtures/tiny-mock/out/App.xcodeproj -scheme App -destination 'generic/platform=iOS' build

  e2e-simulator:
    if: github.event_name == 'push'
    runs-on: macos-14
    timeout-minutes: 30
    env:
      DTC_LLM_MODE: fixture
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install xcodegen
        run: brew install xcodegen
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: Boot simulator + run full pipeline (IR + cassette replay)
        run: node cli/dist/entry.js run --design-ir fixtures/tiny-mock/design-ir.json --platform swiftui --baas mock --no-upload --ci --out fixtures/tiny-mock/out
      - name: Maestro golden flow
        run: maestro test fixtures/tiny-mock/maestro/
