# Phase 1 Plan 07 (GATE-02, D-07, D-08): two-tier E2E smoke gate.
#
# This workflow uses `--design-ir fixtures/tiny-mock/design-ir.json` (NOT
# `--design <pen>`) per the spike fallback path documented in
# `fixtures/tiny-mock/README.md`. The live Pencil MCP offline-capability spike
# was assumed by orchestrator decision to fall back to outcome (c); the
# committed `design-ir.json` is the authoritative input on a vanilla macos-14
# GitHub-hosted runner where Pencil MCP / `pencil` CLI is not present.
name: E2E
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  e2e-build:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run tiny fixture pipeline (build-only, IR fallback)
        run: node cli/dist/entry.js run --design-ir fixtures/tiny-mock/design-ir.json --platform swiftui --baas mock --no-upload --skip-simulator --ci --out fixtures/tiny-mock/out
      - name: xcodebuild compile
        run: xcodebuild -project fixtures/tiny-mock/out/App.xcodeproj -scheme App -destination 'generic/platform=iOS' build

  e2e-simulator:
    if: github.event_name == 'push'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
      - name: Boot simulator + run full pipeline (IR fallback)
        run: node cli/dist/entry.js run --design-ir fixtures/tiny-mock/design-ir.json --platform swiftui --baas mock --no-upload --ci --out fixtures/tiny-mock/out
      - name: Maestro golden flow
        run: maestro test fixtures/tiny-mock/maestro/
