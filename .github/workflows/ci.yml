# Phase 1 Plan 06 (GATE-01, REPO-02, REPO-03): lint + typecheck + test + commitlint + gitleaks on every PR
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build workspace packages so eslint-import-resolver-typescript can
      # resolve @appifex/* imports via each package's dist/index.js main
      # entry. Without this, lint emits ~150 spurious import-x/no-unresolved
      # warnings (harmless but noisy, hides real import issues).
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # Phase 03 (DX-06): exercise the built dist by running
  # `dtc --version` — catches broken publishes before
  # `publish-dry-run` and catches symlink regressions
  # (see Phase 02 RELEASE-01).
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }}

  # We invoke the open-source gitleaks CLI directly rather than gitleaks/gitleaks-action@v2.
  # The gated Action requires a paid GITLEAKS_LICENSE for organization accounts
  # (see https://github.com/gitleaks/gitleaks-action#-announcement); the binary itself is MIT.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --log-opts="--all"

  # Phase 1 Plan 08 (NPM-01): verify every workspace package publishes cleanly to npm.
  # Catches tarball-shape regressions (missing dist/, bad files allowlist, invalid exports)
  # that the fast vitest publish-metadata guard cannot see.
  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify every workspace package publishes cleanly
        run: pnpm publish --dry-run -r --no-git-checks

  # Phase 1 Plan 01-11 (GATE-04): every PR must include a changeset entry.
  # Docs-only PRs satisfy this with an empty changeset file created via
  # `pnpm exec changeset --empty` (see .github/PULL_REQUEST_TEMPLATE.md).
  # The changesets/action in release.yml only runs on push:main for Version
  # Packages PR mode, so this check is what actually enforces the gate on
  # incoming PRs. Once merged, setup-branch-protection.sh adds this job's
  # check name ("changeset-check") to required_status_checks.contexts.
  changeset-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify PR includes a changeset entry
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          # checkout@v4 above already pulled full history (fetch-depth: 0),
          # but the base ref isn't fetched as a remote-tracking branch yet —
          # do that without --depth (--depth=0 is invalid for git-fetch).
          git fetch --no-tags origin "$BASE_REF"
          ADDED=$(git diff --name-only --diff-filter=A "origin/${BASE_REF}...HEAD" -- '.changeset/*.md' \
            | grep -vE '^\.changeset/(README\.md|config\.json)$' || true)
          if [[ -z "$ADDED" ]]; then
            echo "::error::No changeset entry found in this PR."
            echo ""
            echo "Every PR must include a changeset entry describing its change."
            echo "Run: pnpm exec changeset"
            echo ""
            echo "For docs-only / release-irrelevant PRs, record an empty changeset:"
            echo "  pnpm exec changeset --empty"
            echo ""
            echo "Both create a file under .changeset/ — commit it and push."
            exit 1
          fi
          echo "Changeset entries in this PR:"
          echo "$ADDED"
