name: Bug report
description: Report a defect in dtc
title: '[bug]: '
labels: ['bug', 'triage']
body:
  - type: input
    id: version
    attributes:
      label: dtc version
      description: Output of `dtc --version`
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. macOS 14.5
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce the issue
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (pipe through `--verbose` if possible)
      render: shell
